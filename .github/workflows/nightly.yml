name: Nightly benchmarks

# Tier 2 — one card-defined result per recipe (docs/FIDELITY.md §3, P12).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  benchmarks:
    name: Tier 2 — ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        recipe: [tarnet, cnflow, mean_teacher, cycle_dual, ssdml]
    env:
      XTY2_TIER2_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: "pyproject.toml"
      - uses: ./.github/actions/install
      - name: Tier 2 — ${{ matrix.recipe }}
        run: >-
          uv run --no-sync pytest
          tests/benchmarks/test_${{ matrix.recipe }}.py
          --durations=0
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-${{ matrix.recipe }}
          path: |
            runs/
          if-no-files-found: ignore
