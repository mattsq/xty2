name: Install xty2
description: >
  Create the venv and install xty2 with dev extras. torch comes from the CPU
  wheel index first so CI does not pull the multi-gigabyte CUDA build.
runs:
  using: composite
  steps:
    # setup-uv creates and activates .venv when it is given a python-version,
    # so a bare `uv venv` fails with "a virtual environment already exists".
    - name: Create virtualenv
      shell: bash
      run: uv venv --clear
    - name: Install torch (CPU wheels)
      shell: bash
      run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
    - name: Install package
      shell: bash
      run: uv pip install -e ".[dev]"
